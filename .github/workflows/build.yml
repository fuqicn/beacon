# Beacon launcher — cross-platform CI builds.
# Triggers on push/PR to master; always callable manually (workflow_dispatch).
name: Build

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:   # manual trigger from Actions tab

env:
  PYTHON: python
  CMAKE_BUILD_TYPE: Release
  # Cache key prefix; increment when toolchain or Qt version changes.
  CACHE_PREFIX: "qt682-msvc-ninja"

jobs:
  # ---------------------------------------------------------------- Windows (MSVC + Qt 6.8)
  # windows-latest ships VS 2022 Enterprise with MSVC 14.44 + CMake 3.31.
  # pack.py uses cl.exe/rc.exe/link.exe for the C self-extractor — no mingw.
  # Qt 6.8+ prebuilt MSVC binaries require Qt Account login (not available
  # in unauthenticated CI), so we download the source archive (~1.5 GB) on
  # first run and build Qt ourselves. The result is cached for 7 days.
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # Qt 6.8.2 source archive; first CI run downloads + builds (~30 min),
      # subsequent runs hit the 7-day cache and skip the build entirely.
      - name: Cache Qt 6.8 MSVC build tree
        uses: actions/cache@v4
        id: qt-cache
        with:
          path: C:/Qt/${{ env.QT_VERSION }}/msvc2022_64
          key: ${{ runner.os }}-qt-${{ env.CACHE_PREFIX }}

      - name: Download & install Qt 6.8.2 (MSVC)
        if: steps.qt-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $qtv = "6.8.2"
          $url = "https://download.qt.io/official_releases/qt/6.8/$qtv/single/qt-everywhere-src-$qtv.zip"
          Write-Host "Downloading Qt $qtv source archive ..."
          Invoke-WebRequest -Uri $url -OutFile qt.zip -UseBasicParsing
          Write-Host "Extracting to C:/Qt/$qtv ..."
          Expand-Archive qt.zip -DestinationPath C:/Qt -Force
          Remove-Item qt.zip -Force

      - name: Cache CMake build
        uses: actions/cache@v4
        with:
          path: launcher/build
          key: ${{ runner.os }}-build-${{ hashFiles('CMakeLists.txt', 'src/**/*.cpp', 'src/**/*.h', 'third_party/**/*') }}

      - name: Build (Windows, MSVC)
        run: python pack.py

      - uses: actions/upload-artifact@v4
        with:
          name: BeaconLauncher-windows-amd64
          path: dist/BeaconLauncher-windows-amd64.exe

  # ---------------------------------------------------------------- Debian
  # Ubuntu 24.04 ships Qt 6.4.2. CMakeLists.txt requires >= 6.4 so this
  # works out of the box — no external apt repository needed.
  debian:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake ninja-build \
            dpkg-dev debhelper \
            qt6-base-dev qt6-declarative-dev qt6-svg-dev \
            zlib1g-dev python3

      - name: Cache CMake build
        uses: actions/cache@v4
        with:
          path: launcher/build-deb
          key: ${{ runner.os }}-deb-build-${{ hashFiles('CMakeLists.txt', 'src/**/*.cpp', 'src/**/*.h', 'third_party/**/*') }}

      - name: Build .deb
        run: python3 pack.py --build-dir build-deb

      - uses: actions/upload-artifact@v4
        with:
          name: BeaconLauncher-deb-amd64
          path: dist/BeaconLauncher-deb-amd64.deb

  # ---------------------------------------------------------------- Fedora / RHEL
  # Fedora 40 has Qt 6.8.2 in its repos — perfect match.
  fedora:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install podman
        run: |
          sudo apt-get update
          sudo apt-get install -y podman

      - name: Cache CMake build
        uses: actions/cache@v4
        with:
          path: launcher/build-rpm
          key: ${{ runner.os }}-rpm-build-${{ hashFiles('CMakeLists.txt', 'src/**/*.cpp', 'src/**/*.h', 'third_party/**/*') }}

      - name: Build .rpm (Fedora 40 via podman)
        run: |
          podman run --rm \
            -v ${{ github.workspace }}:/workspace:z \
            -w /workspace \
            fedora:40 \
            bash -c '
              dnf install -y cmake ninja-build rpm-build \
                qt6-qtbase-devel qt6-qtdeclarative-devel qt6-qtsvg-devel \
                zlib-devel python3
              python3 pack.py --build-dir build-rpm
            '

      - uses: actions/upload-artifact@v4
        with:
          name: BeaconLauncher-redhat-x86_64
          path: dist/BeaconLauncher-redhat-x86_64.rpm

  # ---------------------------------------------------------------- Arch
  arch:
    runs-on: ubuntu-24.04
    container: archlinux:latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        # Single-line command — no backslash continuations (sh shell).
        run: pacman -Syu --noconfirm base-devel cmake ninja qt6-base qt6-declarative qt6-svg zlib

      - name: Cache CMake build
        uses: actions/cache@v4
        with:
          path: launcher/build-arch
          key: ${{ runner.os }}-arch-build-${{ hashFiles('CMakeLists.txt', 'src/**/*.cpp', 'src/**/*.h', 'third_party/**/*') }}

      - name: Build .pkg.tar.zst
        run: python3 pack.py --build-dir build-arch

      - uses: actions/upload-artifact@v4
        with:
          name: BeaconLauncher-arch-x86_64
          path: dist/BeaconLauncher-arch-x86_64.pkg.tar.zst

  # ---------------------------------------------------------------- macOS (Apple Silicon via macos-14)
  macos:
    runs-on: macos-14   # Apple Silicon (arm64); switch to macos-13 for Intel
    steps:
      - uses: actions/checkout@v4

      # Homebrew is pre-installed on GitHub-hosted macOS runners.
      # qt@6 formula gives us Qt 6.11.1 which satisfies >= 6.4.
      - name: Cache Qt (Homebrew prefix)
        uses: actions/cache@v4
        id: qt-cache
        with:
          path: /opt/homebrew/opt/qt@6
          key: ${{ runner.os }}-qt-macos-${{ env.CACHE_PREFIX }}

      - name: Install Qt 6 (macOS)
        if: steps.qt-cache.outputs.cache-hit != 'true'
        run: brew install qt@6

      - name: Cache CMake build
        uses: actions/cache@v4
        with:
          path: launcher/build-mac
          key: ${{ runner.os }}-mac-build-${{ hashFiles('CMakeLists.txt', 'src/**/*.cpp', 'src/**/*.h', 'third_party/**/*') }}

      - name: Build .app bundle (macOS)
        run: QT_DIR=$(brew --prefix qt@6) python3 pack.py --build-dir build-mac

      - uses: actions/upload-artifact@v4
        with:
          name: Beacon-mac-arm64
          path: dist/Beacon.app
