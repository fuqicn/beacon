# Beacon launcher — cross-platform CI builds.
# Triggers on push/PR to master; always callable manually (workflow_dispatch).
name: Build

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:   # manual trigger from Actions tab

env:
  PYTHON: python
  CMAKE_BUILD_TYPE: Release
  CACHE_PREFIX: "qt682-msvc-ninja"

jobs:
  # ---------------------------------------------------------------- Linux x86_64 (Debian / Fedora / Arch)
  # Single ubuntu-26.04 runner; each distro runs in its own container.
  linux:
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        distro: [debian, fedora, arch]
        include:
          - distro: debian
            container: null           # native runner (has dpkg)
            cache-path: launcher/build-deb
            artifact-name: BeaconLauncher-deb-amd64
            artifact-path: dist/BeaconLauncher-deb-amd64.deb
            extra-artifacts:
              - name: BeaconLauncher-linux-x86_64
                path: dist/beacon-*.linux-x86_64.tar.gz
          - distro: fedora
            container: fedora:40
            cache-path: launcher/build-rpm
            artifact-name: BeaconLauncher-redhat-x86_64
            artifact-path: dist/BeaconLauncher-redhat-x86_64.rpm
          - distro: arch
            container: archlinux:latest
            cache-path: launcher/build-arch
            artifact-name: BeaconLauncher-arch-x86_64
            artifact-path: dist/BeaconLauncher-arch-x86_64.pkg.tar.zst
    container: ${{ matrix.container }}
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies (Debian — native runner)
        if: matrix.distro == 'debian'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake ninja-build dpkg-dev debhelper \
            qt6-base-dev qt6-declarative-dev qt6-svg-dev \
            zlib1g-dev python3

      - name: Install dependencies (Fedora — container)
        if: matrix.distro == 'fedora'
        run: |
          dnf install -y cmake ninja-build rpm-build \
            qt6-qtbase-devel qt6-qtdeclarative-devel qt6-qtsvg-devel \
            zlib-devel python3

      - name: Install dependencies (Arch — container)
        if: matrix.distro == 'arch'
        run: pacman -Syu --noconfirm base-devel cmake ninja qt6-base qt6-declarative qt6-svg zlib

      - name: Cache CMake build
        uses: actions/cache@v4
        with:
          path: ${{ matrix.cache-path }}
          key: ${{ runner.os }}-${{ matrix.distro }}-build-${{ hashFiles('CMakeLists.txt', 'src/**/*.cpp', 'src/**/*.h', 'third_party/**/*') }}

      - name: Build package (${{ matrix.distro }} x86_64)
        run: python3 pack.py --build-dir ${{ matrix.cache-path }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: ${{ matrix.artifact-path }}

      - uses: actions/upload-artifact@v4
        if: matrix.extra-artifacts
        with:
          name: ${{ matrix.extra-artifacts[0].name }}
          path: ${{ matrix.extra-artifacts[0].path }}

  # ---------------------------------------------------------------- Linux ARM64 (Debian / Fedora / Arch)
  # Uses ubuntu-24.04-arm native runner (aarch64).
  linux-arm:
    runs-on: ubuntu-26.04-arm
    strategy:
      fail-fast: false
      matrix:
        distro: [debian, fedora, arch]
        include:
          - distro: debian
            cache-path: launcher/build-deb-arm
            artifact-name: BeaconLauncher-deb-arm64
            artifact-path: dist/BeaconLauncher-deb-arm64.deb
          - distro: fedora
            container: fedora:40
            cache-path: launcher/build-rpm-arm
            artifact-name: BeaconLauncher-redhat-aarch64
            artifact-path: dist/BeaconLauncher-redhat-aarch64.rpm
          - distro: arch
            container: archlinux:latest
            cache-path: launcher/build-arch-arm
            artifact-name: BeaconLauncher-arch-aarch64
            artifact-path: dist/BeaconLauncher-arch-aarch64.pkg.tar.zst
    container: ${{ matrix.container }}
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies (Debian ARM64)
        if: matrix.distro == 'debian'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake ninja-build dpkg-dev debhelper \
            qt6-base-dev qt6-declarative-dev qt6-svg-dev \
            zlib1g-dev python3

      - name: Install dependencies (Fedora ARM64)
        if: matrix.distro == 'fedora'
        run: |
          dnf install -y cmake ninja-build rpm-build \
            qt6-qtbase-devel qt6-qtdeclarative-devel qt6-qtsvg-devel \
            zlib-devel python3

      - name: Install dependencies (Arch ARM64)
        if: matrix.distro == 'arch'
        run: pacman -Syu --noconfirm base-devel cmake ninja qt6-base qt6-declarative qt6-svg zlib

      - name: Cache CMake build
        uses: actions/cache@v4
        with:
          path: ${{ matrix.cache-path }}
          key: ${{ runner.os }}-${{ matrix.distro }}-arm-build-${{ hashFiles('CMakeLists.txt', 'src/**/*.cpp', 'src/**/*.h', 'third_party/**/*') }}

      - name: Build package (${{ matrix.distro }} ARM64)
        run: python3 pack.py --build-dir ${{ matrix.cache-path }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: ${{ matrix.artifact-path }}

  # ---------------------------------------------------------------- Windows x86_64 (MSVC + Qt 6.8)
  windows-x86:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache Qt 6.8 MSVC (x86_64)
        uses: actions/cache@v4
        id: qt-cache
        with:
          path: C:/Qt/6.8.3/msvc2022_64
          key: ${{ runner.os }}-qt-x86-${{ env.CACHE_PREFIX }}

      - name: Install Qt 6.8 (MSVC x86_64)
        if: steps.qt-cache.outputs.cache-hit != 'true'
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2022_64'
          cache: 'true'
          cache-key-prefix: ${{ env.CACHE_PREFIX }}-x86

      - name: Cache CMake build
        uses: actions/cache@v4
        with:
          path: launcher/build
          key: ${{ runner.os }}-build-${{ hashFiles('CMakeLists.txt', 'src/**/*.cpp', 'src/**/*.h', 'third_party/**/*') }}

      - name: Build (Windows x86_64, MSVC)
        run: python pack.py

      - uses: actions/upload-artifact@v4
        with:
          name: BeaconLauncher-windows-amd64
          path: dist/BeaconLauncher-windows-amd64.exe

  # ---------------------------------------------------------------- Windows ARM64 (MSVC + Qt 6.8)
  windows-arm:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache Qt 6.8 MSVC (ARM64 cross-compiled)
        uses: actions/cache@v4
        id: qt-cache
        with:
          path: C:/Qt/6.8.3/msvc2022_arm64
          key: ${{ runner.os }}-qt-arm-${{ env.CACHE_PREFIX }}

      - name: Install Qt 6.8 (MSVC ARM64 cross-compiled)
        if: steps.qt-cache.outputs.cache-hit != 'true'
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2022_arm64_cross_compiled'
          cache: 'true'
          cache-key-prefix: ${{ env.CACHE_PREFIX }}-arm

      - name: Cache CMake build
        uses: actions/cache@v4
        with:
          path: launcher/build-arm
          key: ${{ runner.os }}-build-arm-${{ hashFiles('CMakeLists.txt', 'src/**/*.cpp', 'src/**/*.h', 'third_party/**/*') }}

      - name: Build (Windows ARM64, MSVC)
        run: python pack.py

      - uses: actions/upload-artifact@v4
        with:
          name: BeaconLauncher-windows-arm64
          path: dist/BeaconLauncher-windows-arm64.exe

  # ---------------------------------------------------------------- macOS (ARM64 native + x86_64 cross-compile)
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt 6.8 (macOS)
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.*'
          host: 'mac'
          target: 'desktop'
          cache: 'true'
          cache-key-prefix: ${{ env.CACHE_PREFIX }}

      - name: Cache CMake build (arm64)
        uses: actions/cache@v4
        with:
          path: launcher/build-mac-arm64
          key: ${{ runner.os }}-mac-arm-build-${{ hashFiles('CMakeLists.txt', 'src/**/*.cpp', 'src/**/*.h', 'third_party/**/*') }}

      - name: Build .app (macOS ARM64)
        run: QT_DIR=$QT_ROOT_DIR python3 pack.py --build-dir build-mac-arm64 --osx-arch arm64 --mac-dist-dir dist-mac-arm64

      - uses: actions/upload-artifact@v4
        with:
          name: Beacon-mac-arm64
          path: dist-mac-arm64/Beacon-arm64.app

      - name: Cache CMake build (x86_64)
        uses: actions/cache@v4
        with:
          path: launcher/build-mac-x86_64
          key: ${{ runner.os }}-mac-intel-build-${{ hashFiles('CMakeLists.txt', 'src/**/*.cpp', 'src/**/*.h', 'third_party/**/*') }}

      - name: Build .app (macOS x86_64)
        run: QT_DIR=$QT_ROOT_DIR python3 pack.py --build-dir build-mac-x86_64 --osx-arch x86_64 --mac-dist-dir dist-mac-intel

      - uses: actions/upload-artifact@v4
        with:
          name: Beacon-mac-intel
          path: dist-mac-intel/Beacon-intel.app
