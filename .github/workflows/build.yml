# Beacon launcher — cross-platform CI builds.
# Triggers on push/PR to master; always callable manually (workflow_dispatch).
name: Build

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:   # manual trigger from Actions tab

env:
  PYTHON: python
  CMAKE_BUILD_TYPE: Release
  CACHE_PREFIX: "qt682-msvc-ninja"

jobs:
  # ---------------------------------------------------------------- Debian
  debian:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt 6.8 + system dependencies
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.*'
          host: 'linux'
          target: 'desktop'
          arch: 'linux_gcc_64'
          install-deps: 'true'
          cache: 'true'
          cache-key-prefix: ${{ env.CACHE_PREFIX }}

      - name: Install dev packages for CMake find_package(Qt6 6.8)
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build dpkg-dev debhelper zlib1g-dev python3

      - name: Cache CMake build
        uses: actions/cache@v4
        with:
          path: launcher/build-deb
          key: ${{ runner.os }}-deb-build-${{ hashFiles('CMakeLists.txt', 'src/**/*.cpp', 'src/**/*.h', 'third_party/**/*') }}

      - name: Build .deb
        run: python3 pack.py --build-dir build-deb

      - uses: actions/upload-artifact@v4
        with:
          name: BeaconLauncher-deb-amd64
          path: dist/BeaconLauncher-deb-amd64.deb

      # Also produce a generic Linux tarball (works on any distro).
      - uses: actions/upload-artifact@v4
        with:
          name: BeaconLauncher-linux-x86_64
          path: dist/beacon-*.linux-x86_64.tar.gz

  # ---------------------------------------------------------------- Fedora / RHEL
  fedora:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install podman
        run: |
          sudo apt-get update
          sudo apt-get install -y podman

      - name: Cache CMake build
        uses: actions/cache@v4
        with:
          path: launcher/build-rpm
          key: ${{ runner.os }}-rpm-build-${{ hashFiles('CMakeLists.txt', 'src/**/*.cpp', 'src/**/*.h', 'third_party/**/*') }}

      - name: Build .rpm (Fedora 40 via podman)
        run: |
          podman run --rm \
            -v ${{ github.workspace }}:/workspace:z \
            -w /workspace \
            fedora:40 \
            bash -c '
              dnf install -y cmake ninja-build rpm-build \
                qt6-qtbase-devel qt6-qtdeclarative-devel qt6-qtsvg-devel \
                zlib-devel python3
              python3 pack.py --build-dir build-rpm
            '

      - uses: actions/upload-artifact@v4
        with:
          name: BeaconLauncher-redhat-x86_64
          path: dist/BeaconLauncher-redhat-x86_64.rpm

  # ---------------------------------------------------------------- Arch
  # Docker container runs as root; build_arch_pkg creates archbuilder via su.
  arch:
    runs-on: ubuntu-24.04
    container: archlinux:latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: pacman -Syu --noconfirm base-devel cmake ninja qt6-base qt6-declarative qt6-svg zlib

      - name: Cache CMake build
        uses: actions/cache@v4
        with:
          path: launcher/build-arch
          key: ${{ runner.os }}-arch-build-${{ hashFiles('CMakeLists.txt', 'src/**/*.cpp', 'src/**/*.h', 'third_party/**/*') }}

      - name: Build .pkg.tar.zst
        run: python3 pack.py --build-dir build-arch

      - uses: actions/upload-artifact@v4
        with:
          name: BeaconLauncher-arch-x86_64
          path: dist/BeaconLauncher-arch-x86_64.pkg.tar.zst

  # ---------------------------------------------------------------- macOS x86_64 (Intel)
  macos-intel:
    runs-on: macos-13
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt 6.8 (macOS x86_64)
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.*'
          host: 'mac'
          target: 'desktop'
          arch: 'clang_64'
          cache: 'true'
          cache-key-prefix: ${{ env.CACHE_PREFIX }}

      - name: Cache CMake build
        uses: actions/cache@v4
        with:
          path: launcher/build-mac-intel
          key: ${{ runner.os }}-mac-intel-build-${{ hashFiles('CMakeLists.txt', 'src/**/*.cpp', 'src/**/*.h', 'third_party/**/*') }}

      - name: Build .app bundle (macOS x86_64)
        run: QT_DIR=$QT_ROOT_DIR python3 pack.py --build-dir build-mac-intel

      - uses: actions/upload-artifact@v4
        with:
          name: Beacon-mac-intel
          path: dist/Beacon.app

  # ---------------------------------------------------------------- macOS ARM64 (Apple Silicon)
  macos-arm:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt 6.8 (macOS arm64)
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.*'
          host: 'mac'
          target: 'desktop'
          cache: 'true'
          cache-key-prefix: ${{ env.CACHE_PREFIX }}

      - name: Cache CMake build
        uses: actions/cache@v4
        with:
          path: launcher/build-mac-arm
          key: ${{ runner.os }}-mac-arm-build-${{ hashFiles('CMakeLists.txt', 'src/**/*.cpp', 'src/**/*.h', 'third_party/**/*') }}

      - name: Build .app bundle (macOS ARM64)
        run: QT_DIR=$QT_ROOT_DIR python3 pack.py --build-dir build-mac-arm

      - uses: actions/upload-artifact@v4
        with:
          name: Beacon-mac-arm64
          path: dist/Beacon.app
