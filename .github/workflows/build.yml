# Beacon launcher — cross-platform CI builds.
# Triggers on push/PR to master; always callable manually (workflow_dispatch).
name: Build

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:   # manual trigger from Actions tab

env:
  PYTHON: python
  CMAKE_BUILD_TYPE: Release
  CACHE_PREFIX: "qt682-msvc-ninja"

jobs:
  # ---------------------------------------------------------------- Windows (MSVC + Qt 6.8)
  # windows-latest has VS Build Tools (cl.exe / rc.exe / link.exe).
  # install-qt-action downloads prebuilt Qt 6.8 MSVC binaries from Qt CDN
  # and sets QT_ROOT_DIR so pack.py finds qmake/cmake without manual path config.
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt 6.8 (MSVC)
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.*'
          arch: 'win64_msvc2022_64'
          cache: 'true'
          cache-key-prefix: ${{ env.CACHE_PREFIX }}

      - name: Cache CMake build
        uses: actions/cache@v4
        with:
          path: launcher/build
          key: ${{ runner.os }}-build-${{ hashFiles('CMakeLists.txt', 'src/**/*.cpp', 'src/**/*.h', 'third_party/**/*') }}

      - name: Build (Windows, MSVC)
        run: python pack.py

      - uses: actions/upload-artifact@v4
        with:
          name: BeaconLauncher-windows-amd64
          path: dist/BeaconLauncher-windows-amd64.exe

  # ---------------------------------------------------------------- Debian
  # install-qt-action with install-deps=true installs Qt runtime deps via apt.
  # We also need the -dev packages for CMake's find_package(Qt6 6.8); these
  # are pulled in automatically by the action's install-deps step.
  debian:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt 6.8 + system dependencies
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.*'
          host: 'linux'
          target: 'desktop'
          arch: 'linux_gcc_64'
          install-deps: 'true'
          cache: 'true'
          cache-key-prefix: ${{ env.CACHE_PREFIX }}

      - name: Cache CMake build
        uses: actions/cache@v4
        with:
          path: launcher/build-deb
          key: ${{ runner.os }}-deb-build-${{ hashFiles('CMakeLists.txt', 'src/**/*.cpp', 'src/**/*.h', 'third_party/**/*') }}

      - name: Build .deb
        run: python3 pack.py --build-dir build-deb

      - uses: actions/upload-artifact@v4
        with:
          name: BeaconLauncher-deb-amd64
          path: dist/BeaconLauncher-deb-amd64.deb

      # Also produce a generic Linux tarball (works on any distro).
      - uses: actions/upload-artifact@v4
        with:
          name: BeaconLauncher-linux-x86_64
          path: dist/beacon-*.linux-x86_64.tar.gz

  # ---------------------------------------------------------------- Fedora / RHEL
  fedora:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install podman
        run: |
          sudo apt-get update
          sudo apt-get install -y podman

      - name: Cache CMake build
        uses: actions/cache@v4
        with:
          path: launcher/build-rpm
          key: ${{ runner.os }}-rpm-build-${{ hashFiles('CMakeLists.txt', 'src/**/*.cpp', 'src/**/*.h', 'third_party/**/*') }}

      - name: Build .rpm (Fedora 40 via podman)
        run: |
          podman run --rm \
            -v ${{ github.workspace }}:/workspace:z \
            -w /workspace \
            fedora:40 \
            bash -c '
              dnf install -y cmake ninja-build rpm-build \
                qt6-qtbase-devel qt6-qtdeclarative-devel qt6-qtsvg-devel \
                zlib-devel python3
              python3 pack.py --build-dir build-rpm
            '

      - uses: actions/upload-artifact@v4
        with:
          name: BeaconLauncher-redhat-x86_64
          path: dist/BeaconLauncher-redhat-x86_64.rpm

  # ---------------------------------------------------------------- macOS (Apple Silicon via macos-14)
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt 6.8 (macOS)
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.*'
          host: 'mac'
          target: 'desktop'
          cache: 'true'
          cache-key-prefix: ${{ env.CACHE_PREFIX }}

      - name: Cache CMake build
        uses: actions/cache@v4
        with:
          path: launcher/build-mac
          key: ${{ runner.os }}-mac-build-${{ hashFiles('CMakeLists.txt', 'src/**/*.cpp', 'src/**/*.h', 'third_party/**/*') }}

      - name: Build .app bundle (macOS)
        run: QT_DIR=$QT_ROOT_DIR python3 pack.py --build-dir build-mac

      - uses: actions/upload-artifact@v4
        with:
          name: Beacon-mac-arm64
          path: dist/Beacon.app
