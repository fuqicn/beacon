app-id: io.github.fuqicn.beacon
runtime: org.kde.Platform
runtime-version: '6.8'
sdk: org.kde.Sdk
command: beacon

finish-args:
  - --share=network
  - --share=ipc
  - --socket=x11
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --talk-name=ca.desrt.dconf
  - --talk-name=org.freedesktop.Notifications

modules:
  - name: beacon
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DCMAKE_INSTALL_PREFIX=/app
    sources:
      - type: dir
        path: ..
    post-install:
      - install -Dm644 flatpak/io.github.fuqicn.beacon.desktop /app/share/applications/io.github.fuqicn.beacon.desktop
      - install -Dm644 flatpak/io.github.fuqicn.beacon.metainfo.xml /app/share/metainfo/io.github.fuqicn.beacon.metainfo.xml
      - install -Dm644 Untitled.svg /app/share/icons/hicolor/scalable/apps/io.github.fuqicn.beacon.svg
